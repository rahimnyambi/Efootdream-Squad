.support{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:14px;color:var(--mut)}.support a{color:var(--pri);text-transform:none;font-weight:600;word-break:break-all}
h1,h2,h3{font-family:var(--f);margin:0;line-height:1.15}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 10px}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.account-name{font-size:13px;font-weight:700;color:var(--pri)}
.brand{font:800 26px var(--f);letter-spacing:.03em}
.brand i{font-style:normal;color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surf);padding:3px}
.seg button{border:0;background:none;color:var(--mut);font:600 14px var(--f);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pinv)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:600 16px var(--f);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-color:#f0c52e}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.hero{padding:6px 0 18px;max-width:640px}
.hero h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
.hero p{color:var(--mut);margin:8px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;text-transform:uppercase;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.bar input{flex:2 1 200px;width:auto}.bar select{flex:1 1 150px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:19px}
.game{font-size:13px;font-weight:600;color:var(--pri)}
.mut{color:var(--mut);font-size:14px}
.price{font:800 22px var(--f)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.btn{border:1px solid #f0c52e;background:#f0c52e;color:#10264a;font:600 15px var(--f);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.alt{background:none;color:var(--pri)}.btn.bad{background:none;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:#fff1bd;color:#765000}
.tag.amb{background:var(--ambBg);color:var(--amb)}.tag.red{background:var(--redBg);color:var(--red)}
form.card{max-width:520px;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.list{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px;margin:6px 0}
.steps div{flex:1;font-size:12.5px;color:var(--mut);border-top:4px solid var(--line);padding-top:4px}
.steps div.on{border-color:var(--pri);color:var(--ink);font-weight:600}
.steps.bad div.on{border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:800 22px var(--f)}
h2{font-size:22px;margin:22px 0 10px}
.empty{color:var(--mut);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surf);border-radius:14px;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.methods label{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400}
.sum{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.sum div{display:flex;justify-content:space-between}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.note{font-size:13px;color:var(--mut);margin-top:24px}
.raw{text-transform:none}
.sec{font-size:14px;color:var(--pri);margin-top:4px}
.cred{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px;word-break:break-all}
.cred b{color:var(--pri);margin-bottom:2px}
.chat{display:flex;flex-direction:column;gap:8px;height:260px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px}
.msg{max-width:85%;padding:7px 10px;border-radius:10px;font-size:14px;background:var(--surf);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--pri);border-color:var(--pri);color:var(--pinv)}
.msg.adm{align-self:flex-end;background:#ffe08a;border:2px solid #c58b00;color:#332400}.msg.usr{align-self:flex-start;background:#d9f4e5;border:2px solid #16834a;color:#123d28}.chat-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:12px}.chat-legend span{display:inline-flex;align-items:center;gap:6px}.chat-legend i{display:inline-block;width:12px;height:12px;border-radius:4px}.chat-legend .admin-key{background:#ffe08a;border:1px solid #c58b00}.chat-legend .user-key{background:#d9f4e5;border:1px solid #16834a}
.msg small{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.chatform{display:flex;gap:8px}.chatform input{flex:1;width:auto}
.shot{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0;cursor:zoom-in;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot.none{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;cursor:default}
.bigshot{position:relative}.bigshot img{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}
.card.soldc{position:relative;overflow:hidden}.card.soldc>*:not(.stamp){opacity:.5}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:4px solid var(--red);color:var(--red);background:color-mix(in srgb,var(--surf) 88%,transparent);padding:6px 18px;font-size:28px;letter-spacing:.08em;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:2}
.complete-seal{position:relative;overflow:hidden;border:2px solid #16834a;background:linear-gradient(135deg,var(--surf),#edf8f0)}.complete-seal.refunded{border-color:var(--red);background:linear-gradient(135deg,var(--surf),#fff0ee)}.complete-seal .seal-mark{position:absolute;right:14px;top:14px;transform:rotate(10deg);border:4px double #16834a;color:#16834a;padding:5px 12px;font-weight:900;letter-spacing:.12em;font-size:17px;border-radius:6px;pointer-events:none}.complete-seal.refunded .seal-mark{border-color:var(--red);color:var(--red)}.complete-seal .seal-caption{font-size:12px;color:var(--mut);margin-top:6px}
.pay{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:4px 10px;border-radius:6px;color:#fff;font-size:13px;letter-spacing:.04em;white-space:nowrap;line-height:1}
.pay small{font-size:9px;margin-left:4px;opacity:.95}
.pay.logo{background:#fff;border:1px solid var(--line);padding:2px 8px}.pay.logo img{height:40px;width:auto;display:block;border-radius:3px}.pay.mx{background:#2a3fd6}.pay.am{background:#d90000;text-transform:lowercase}.pay.hp{background:#c24800}.pay.cd{background:var(--ink);color:var(--bg)}
.paystrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px}
body{display:flex;flex-direction:column;min-height:100vh}
.inner{max-width:980px;margin:0 auto;padding:0 16px;width:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surf);border-bottom:1px solid var(--line)}
.top header{padding:12px 0 4px}
.top nav{margin:0;border:0;gap:2px}
.top nav button{padding:10px 14px 11px;font-size:15px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#f0c52e;color:#10264a;font-size:15px;letter-spacing:0;font-style:normal}.brand-logo{display:block;width:54px;height:54px;object-fit:contain;flex:0 0 auto;border-radius:10px}.foot .brand-logo{width:44px;height:44px}
.tagline{font-size:11px;color:var(--mut);letter-spacing:.1em}
.demo{display:flex;align-items:center;gap:8px}.demo .mut{font-size:12px}
.wrap{flex:1;width:100%;padding-top:24px}
.hero{max-width:760px;padding:0 0 12px}
.hero p{font-size:15px}
.trust{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px}
.trust li::before{content:"\2713";color:var(--pri);margin-right:6px}
.paystrip{margin:0 0 14px}
.bar{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px}
.resbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin:4px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.resbar b{font-size:18px}.resbar .mut{font-size:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{padding:14px;gap:10px;box-shadow:0 1px 3px rgba(16,38,74,.08)}
.card h3{font-size:17px;line-height:1.25}
.grid .card:hover{border-color:var(--pri)}
.grid .card>.row:last-child{border-top:1px solid var(--line);padding-top:12px}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border-radius:8px}.btn:hover:not(:disabled){filter:brightness(.95)}
.modal{box-shadow:0 16px 48px rgba(0,0,0,.3)}
form.card{max-width:560px}
.foot{margin-top:40px;background:var(--surf);border-top:1px solid var(--line)}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1.7fr;gap:24px;padding-top:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.foot p{margin:6px 0 0;font-size:13px;color:var(--mut)}
.foot .brand{font-size:19px}.foot a{color:var(--pri);text-transform:none;font-weight:600;word-break:break-all}
.foot-social{display:flex;align-items:flex-start;justify-content:flex-start;padding-top:2px}
.foot-social a{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:#1877f2;color:#fff;text-decoration:none;transition:transform .15s,filter .15s}
.foot-social a:hover{transform:translateY(-2px);filter:brightness(.92)}
.foot-social svg{width:23px;height:23px;fill:currentColor}
@media (max-width:720px){.foot-grid{grid-template-columns:1fr;gap:16px}.demo .mut{display:none}}
.linkbtn{background:none;border:0;padding:0;color:var(--mut);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* SafeSwap organized marketplace layout */
:root{--pri:#1454d8;--accent:#ffd51f;--ink:#101d49;--bg:#f4f7ff}
body{text-transform:none;letter-spacing:0}
.brand,.brand i,.tagline,.seg button,nav button,h1,h2,h3,.btn,.tag,.price,.game,.sec,.eyebrow,.section-chip,.feature b{letter-spacing:0}
.brand i{color:#e6b900}
.market-hero{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:18px;min-height:300px;overflow:hidden;border-radius:24px;padding:clamp(24px,4vw,42px);margin:4px 0 20px;color:#fff;background:radial-gradient(ellipse at 78% 20%,#286eff 0,transparent 35%),linear-gradient(120deg,#07184e 0%,#0735a7 58%,#0b55e8 100%);box-shadow:0 14px 34px rgba(12,44,122,.2)}
.market-hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(125deg,transparent 0 42px,rgba(255,255,255,.035) 43px 45px);pointer-events:none}

.market-hero:after{z-index:1}
.hero-copy{position:relative;z-index:2;max-width:590px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#ffd51f}.market-hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:12px 0;color:white}.market-hero h1 em{display:block;color:#ffd51f;font-style:normal}.market-hero p{max-width:520px;color:#e0e9ff;font-size:15px;line-height:1.65}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.hero-cta{background:#ffd51f;border-color:#ffd51f;color:#091b50;padding:12px 20px}.hero-secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.55);color:white;padding:12px 20px}.hero-note{margin-top:18px;font-size:12px;color:#dce7ff}.hero-note span{padding:0 6px;color:#ffd51f}.hero-art{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-art b{position:relative;z-index:2;font-size:clamp(23px,3vw,37px);line-height:1.05;text-align:center;color:rgba(255,255,255,.94);text-shadow:0 5px 18px #061747}.hero-art strong{color:#ffd51f}.stadium-ball{position:absolute;font-size:130px;opacity:.22;transform:rotate(-18deg)}.hero-shield{position:absolute;z-index:3;right:7%;top:8%;width:58px;height:68px;display:grid;place-items:center;background:#ffd51f;color:#09235f;font-size:32px;font-weight:900;clip-path:polygon(50% 0,100% 18%,92% 72%,50% 100%,8% 72%,0 18%)}.hero-orbit{position:absolute;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:250px;height:250px;transform:rotate(-24deg)}.orbit-two{width:330px;height:150px;transform:rotate(35deg)}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px}.feature{display:flex;flex-direction:column;gap:5px;min-height:128px;padding:17px 14px;border:1px solid #dce6fb;border-radius:16px;background:linear-gradient(145deg,#fff,#edf3ff);box-shadow:0 4px 12px rgba(16,38,74,.045)}.feature>span{font-size:25px}.feature b{font-size:14px;color:#10265b}.feature small{font-size:12px;line-height:1.4;color:#63728f}.paystrip{align-items:center;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e0e8f7}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-heading h2{margin:5px 0 0;font-size:clamp(22px,3vw,29px)}.section-chip{font-size:10px;font-weight:800;letter-spacing:.1em;color:#1454d8;background:#e7efff;border-radius:99px;padding:7px 11px}.marketplace-section .bar{box-shadow:0 5px 16px rgba(16,38,74,.04)}.resbar{margin-top:18px}.top{background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.top nav button{border-radius:10px 10px 0 0}.top nav button[aria-current="page"]{background:#eef3ff;color:#1047b7}
@media(max-width:700px){.market-hero{grid-template-columns:1fr;min-height:0;padding:25px 22px}.hero-art{position:absolute;right:-28px;bottom:-30px;width:44%;min-height:170px;opacity:.55}.market-hero h1{font-size:38px;max-width:75%}.market-hero p{max-width:75%;font-size:13px}.hero-note{max-width:75%;font-size:10px}.feature-grid{grid-template-columns:repeat(2,1fr);gap:8px}.feature{min-height:112px;padding:13px}.section-heading{align-items:center}.section-chip{font-size:9px}.grid{grid-template-columns:1fr}}
@media(max-width:430px){.market-hero h1{font-size:32px}.market-hero p{max-width:100%}.hero-art{opacity:.25;width:55%}.hero-note{max-width:100%}.hero-actions .btn{flex:1}.feature b{font-size:13px}.feature small{font-size:11px}}

function listing(id){return S.listings.find(l=>l.id===id)}
function waNum(x){const raw=String(x||'').trim();let d=raw.replace(/\D/g,'');if(!raw.startsWith('+')&&d.startsWith('0'))d='255'+d.slice(1);return d}
function contactHtml(l){return l.detail?`Contact: <a href="https://wa.me/${waNum(l.detail)}" target="_blank" rel="noopener">${esc(l.detail)}</a> (WhatsApp)`:''}
function adminCreds(l){return l.konami?`<span class="mut raw">Seller contact: ${esc(l.detail||'')} · Konami ID: ${esc(l.konami.id)} · Password: ${esc(l.konami.pw)}</span>`:''}
function ttl(l){return "Collective Strength "+Number(l.strength||0).toLocaleString("en-US")}

function shotHtml(l){return l.shot?`<button type="button" class="shot" onclick="viewSquad(${l.id})" aria-label="View the squad screenshot larger"><img src="${l.shot}" alt="Squad screenshot showing Collective Strength ${Number(l.strength||0).toLocaleString('en-US')}"></button>`:'<div class="shot none">No screenshot uploaded</div>'}
function viewSquad(id){const l=listing(id),old=$('#vsOv');if(old)old.remove();
  const sold=l.status==='sold',n=Number(l.strength||0).toLocaleString('en-US');
  const ov=document.createElement('div');ov.className='ov';ov.id='vsOv';
  ov.innerHTML=`<div class="modal" style="max-width:760px" role="dialog" aria-modal="true" aria-label="Squad screenshot">
  <h3>${esc(ttl(l))}</h3>
  <div class="bigshot">${l.shot?`<img src="${l.shot}" alt="Squad screenshot showing Collective Strength ${n}">`:'<div class="empty">The seller has not uploaded a screenshot for this listing.</div>'}${sold?'<div class="stamp">Sold out</div>':''}</div>
  <span class="tag">SQUAD COLLECTIVE STRENGTH: ${n}</span><span class="mut">${contactHtml(l)}</span>
  <div class="row"><span class="price">${tsh(total(l.price))}</span>${sold?'<button class="btn" disabled>Sold out</button>':l.status==='live'?`<button class="btn" onclick="$('#vsOv').remove();buy(${l.id})">Buy now</button>`:''}</div>
  <button type="button" class="btn alt" onclick="$('#vsOv').remove()">Close</button></div>`;
  document.body.appendChild(ov)}
function openSignup(){
  if(S.currentUser){toast('You are already logged in.');return}
  const old=$('#signupOverlay');if(old)old.remove();const o=document.createElement('div');o.className='ov';o.id='signupOverlay';
  const cs=['Tanzania','Kenya','Uganda','Rwanda','Burundi','DR Congo','Zambia','Malawi','Mozambique','Nigeria','Ghana','South Africa','Other'].map(c=>`<option>${c}</option>`).join('');
  o.innerHTML=`<form class="modal" style="max-height:92vh;overflow:auto" role="dialog" aria-modal="true" aria-label="Create your eFootDream Squad account" onsubmit="signup(event);return false">
    <h2 style="margin:0">Create Your Account</h2><p class="mut">Join eFootDream Squad to buy and sell eFootball accounts safely through escrow.</p>
    <label>Full Name<input name="fullname" required maxlength="70" autocomplete="name" placeholder="First and last name"></label>
    <label>Username<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z]+" title="Letters only (A–Z), no spaces, numbers or symbols" autocomplete="username" placeholder="Letters only"></label>
    <label>Email Address<input name="email" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label>
    <label>Phone Number<input name="phone" type="tel" required maxlength="20" autocomplete="tel" inputmode="tel" placeholder="+255 712 345 678"></label>
    <label>Country<select name="country" required autocomplete="country-name"><option value="">Select your country</option>${cs}</select></label>
    <label>Password<input name="password" type="password" data-pw required minlength="8" autocomplete="new-password" placeholder="8+ characters, letter and number" oninput="pwMeter(this.value)"></label>
    <div aria-hidden="true" style="height:6px;border-radius:4px;background:rgba(128,128,128,.3);overflow:hidden"><i id="pwFill" style="display:block;height:100%;width:0;transition:width .2s,background .2s"></i></div>
    <span class="mut" id="pwTxt" style="font-size:13px"></span>
    <label>Confirm Password<input name="confirm" type="password" data-pw required minlength="8" autocomplete="new-password" placeholder="Enter your password again"></label>
    <label class="mut" style="display:flex;flex-direction:row;align-items:center;gap:8px"><input type="checkbox" style="width:auto" onchange="this.form.querySelectorAll('[data-pw]').forEach(i=>i.type=this.checked?'text':'password')">Show passwords</label>
    <details class="mut"><summary>Terms of use (summary)</summary><ul style="margin:8px 0 0;padding-left:18px">
      <li>Only list accounts you own and are allowed to sell.</li>
      <li>Do not share logins outside the escrow and chat flow in this app.</li>
      <li>Describe each account honestly, including its real Collective Strength.</li></ul></details>
    <label class="mut" style="display:flex;flex-direction:row;align-items:flex-start;gap:8px"><input name="terms" type="checkbox" required style="width:auto;margin-top:3px">I am 18 or older and I accept the terms of use.</label>
    <span id="signupErr" role="alert" style="color:var(--red);font-size:14px"></span>
    <button class="btn" type="submit">Create Account</button>
    <button class="btn alt" type="button" onclick="$('#signupOverlay').remove()">Cancel</button>
    <button type="button" class="linkbtn" onclick="openLogin()">Already have an account? Log in</button>
    <span class="mut" style="font-size:13px">Passwords are salted and hashed, never saved as plain text. Your account is stored in this browser, and you get a recovery code after signing up.</span></form>`;
  document.body.appendChild(o);o.querySelector('input[name=fullname]').focus();
}
function pwMeter(v){
  let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(/[A-Za-z]/.test(v)&&/\d/.test(v))s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const L=[['Too weak','#d33'],['Weak','#d33'],['Fair','#e90'],['Good','#7b3'],['Strong','#2a5'],['Very strong','#2a5']][v?s:0];
  const fl=$('#pwFill'),tx=$('#pwTxt');if(fl){fl.style.width=(v?Math.max(12,s*20):0)+'%';fl.style.background=L[1]}if(tx)tx.textContent=v?'Strength: '+L[0]:'';
}
async function signup(e){
  e.preventDefault();const form=e.target,f=new FormData(form),btn=form.querySelector('button[type=submit]'),box=$('#signupErr');
  const err=(m,n)=>{box.textContent=m;if(n&&form.elements[n])form.elements[n].focus()};err('');
  const g=k=>String(f.get(k)||'').trim();
  const fullname=g('fullname').replace(/\s+/g,' '),username=g('username'),email=g('email').toLowerCase(),phone=g('phone').replace(/[\s()-]/g,''),country=g('country'),password=String(f.get('password')),confirm=String(f.get('confirm'));
  if(fullname.length<3||!/\s/.test(fullname))return err('Enter your full name (first and last).','fullname');
  if(!/^[A-Za-z]{3,24}$/.test(username))return err('Username must be 3–24 letters only (A–Z). No numbers, spaces or symbols.','username');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Enter a valid email address.','email');
  if(!/^\+?\d{9,15}$/.test(phone))return err('Enter a valid phone number, for example +255712345678.','phone');
  if(!country)return err('Select your country.','country');
  if(password.length<8||!/[A-Za-z]/.test(password)||!/\d/.test(password))return err('Password needs 8+ characters with at least one letter and one number.','password');
  if(password!==confirm)return err('Passwords do not match.','confirm');
  if(!f.get('terms'))return err('Please confirm you are 18+ and accept the terms.');
  btn.disabled=true;btn.textContent='Creating account…';
  const undo=m=>{btn.disabled=false;btn.textContent='Create Account';return err(m)};
  try{
    const {data:free}=await sb.rpc('username_available',{u:username});
    if(free===false)return undo('That username is already taken.');
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{fullname,username,phone,country}}});
    if(error)return undo(/regist|already/i.test(error.message)?'That email is already registered. Try logging in.':error.message);
    if(data.user&&data.user.identities&&data.user.identities.length===0)return undo('That email is already registered. Try logging in.');
    $('#signupOverlay')?.remove();
    toast(data.session?'Welcome to SafeSwap, '+username+'!':'Account created. Check your email to confirm it, then log in.');
  }catch(x){undo('Could not create account. Please try again.')}
}

async function login(e){
  e.preventDefault();const form=e.target,f=new FormData(form),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));
  if(Date.now()<(window.loginLock||0)){toast('Too many attempts. Try again in a minute.');return false}
  const btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Checking…';
  try{const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){window.loginFails=(window.loginFails||0)+1;if(window.loginFails>=5){window.loginLock=Date.now()+60000;window.loginFails=0}
      toast(/confirm/i.test(error.message)?'Confirm your email first, then log in.':'Incorrect email or password.');btn.disabled=false;btn.textContent='Log In';return false}
    window.loginFails=0;
    try{const {data:isAdm}=await sb.rpc('is_admin_account');
      if(isAdm===true){await sb.rpc('admin_logout');await sb.auth.signOut();btn.disabled=false;btn.textContent='Log In';toast('This is an admin account. Use the Admin login link in the footer.');return false}}catch(_){}
    $('#loginOverlay')?.remove();toast('Welcome back!');
  }catch(_){btn.disabled=false;btn.textContent='Log In';toast('Could not log in. Please try again.')}
  return false}

const trOrig=new WeakMap();
function tx(str){const m=str.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2].replace(/\s+/g,' ');let v=SW[core];
  if(v===undefined)for(const[re,f]of PAT){const r=core.match(re);if(r){v=f(r);break}}
  return v===undefined?null:m[1]+v+m[3]}
function applyTheme(){const t=Pref.get().theme,dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}
function applyLang(){
  const sw=Pref.get().lang==='sw';document.documentElement.lang=sw?'sw':'en';obs.disconnect();
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  for(let n;n=w.nextNode();){
    const rec=trOrig.get(n),en=rec&&(n.nodeValue===rec.out||n.nodeValue===rec.en)?rec.en:n.nodeValue,out=sw?(tx(en)??en):en;
    if(n.nodeValue!==out)n.nodeValue=out;
    if(out!==en)trOrig.set(n,{en,out});else trOrig.delete(n)}
  document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(el=>{
    const store=trOrig.get(el)||{};let any=false;
    for(const a of['placeholder','aria-label','title','alt']){if(!el.hasAttribute(a))continue;
      const cur=el.getAttribute(a),rec=store[a],en=rec&&(cur===rec.out||cur===rec.en)?rec.en:cur,out=sw?(tx(en)??en):en;
      if(cur!==out)el.setAttribute(a,out);if(out!==en){store[a]={en,out};any=true}else delete store[a]}
    if(any||Object.keys(store).length)trOrig.set(el,store)});
  startObs()}

async function saveMyListing(e,id){
  e.preventDefault();const l=listing(id),form=e.target,f=new FormData(form);
  if(!ownsListing(l)){toast('This listing can no longer be changed.');return false}
  const strength=Number(f.get('strength')),price=Number(f.get('price')),detail=String(f.get('detail')||'').trim(),kid=String(f.get('kid')||'').trim(),kpw=String(f.get('kpw')||'');
  if(!Number.isInteger(strength)||strength<3100||strength===3300||!Number.isInteger(price)||price<1){toast('Enter a valid Collective Strength and whole-number price.');return false}
  if(!/^\+?[\d\s-]{9,15}$/.test(detail)||!kid||!kpw){toast('Check your contact number, Konami ID and password.');return false}
  const priceMsg=Number(l.price)!==price?'Change the price from '+tsh(l.price)+' to '+tsh(price)+'? ':'';
  if(!confirm('Are you sure? '+priceMsg+'Your changes will be saved'+(l.status==='rejected'?' and the listing will be sent to the admin for approval again':'')+'. Do you want to continue?'))return false;
  const btn=form.querySelector('button[type=submit]');btn.disabled=true;
  try{
    const file=f.get('shot');let shot=l.shot;
    if(file&&file.size){if(!/^image\//.test(file.type))throw new Error('Choose an image file for the screenshot.');shot=await readShot(file)}
    const {data:up,error}=await sb.from('listings').update({strength,price,shot,status:l.status==='rejected'?'pending':l.status,reject_reason:null}).eq('id',id).eq('seller_name',S.currentUser.username).select('id');
    if(error)throw error;
    if(!up||!up.length)throw new Error('Not saved: the database refused the change (missing update permission). Run the SQL in supabase_listing_policies.sql.');
    const {data:us,error:se}=await sb.from('listing_secrets').update({contact:detail,konami_id:kid,konami_pw:kpw}).eq('listing_id',id).select('listing_id');
    if(se)throw se;
    if(!us||!us.length)throw new Error('Listing saved, but contact/Konami details were refused (missing update permission on listing_secrets).');
    $('#editListingOv')?.remove();toast('Your listing was updated.');await loadData();render();
  }catch(x){btn.disabled=false;toast(x.message||'Could not update listing. Check your permissions.')}
  return false;
}
async function deleteMyListing(id){
  const l=listing(id);if(!ownsListing(l)){toast('You can only delete your own listing.');return}
  const hasOrder=S.orders.some(o=>o.lid===id)||l.status==='sold';
  if(!confirm(hasOrder?'Are you sure you want to delete this order? It has an order or was sold. It will be removed from the marketplace and this cannot be undone.':'Are you sure you want to delete this order? This cannot be undone.'))return;
  try{
    const {data:gone,error}=await sb.from('listings').delete().eq('id',id).eq('seller_name',S.currentUser.username).select('id');
    if(error)throw error;
    if(!gone||!gone.length)throw new Error('Not deleted: the database refused it (missing delete permission). Run the SQL in supabase_listing_policies.sql.');
    S.listings=S.listings.filter(x=>x.id!==id);render();
    toast('Your listing was deleted.');await loadData();render();
  }catch(x){toast(x.message||'Could not delete listing. Check your permissions.')}
}
function readShot(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej();r.onload=()=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>650000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};im.src=r.result};r.readAsDataURL(file)})}

    const {data,error}=await sb.from('listings').insert({seller_name:S.currentUser.username,game:f.get('game'),strength,price,shot}).select('id').single();if(error)throw error;
    const r2=await sb.from('listing_secrets').insert({listing_id:data.id,contact:detail,konami_id:String(f.get('kid')).trim(),konami_pw:String(f.get('kpw'))});if(r2.error)throw r2.error;

function sha256(m){const P=[];for(let n=2;P.length<64;n++)if(P.every(p=>n%p))P.push(n);
 const f=x=>Math.floor((x%1)*4294967296),K=P.map(p=>f(Math.cbrt(p))),H=P.slice(0,8).map(p=>f(Math.sqrt(p)));
 const b=Array.from(new TextEncoder().encode(m)),L=b.length*8,r=(x,n)=>x>>>n|x<<32-n;b.push(128);while(b.length%64!==56)b.push(0);b.push(0,0,0,0,L>>>24&255,L>>>16&255,L>>>8&255,L&255);
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=b[o+4*i]<<24|b[o+4*i+1]<<16|b[o+4*i+2]<<8|b[o+4*i+3];
  for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^a>>>3)+w[i-7]+(r(c,17)^r(c,19)^c>>>10))|0}
  let[a,q,c,d,e,g,h,j]=H;
  for(let i=0;i<64;i++){const t1=(j+(r(e,6)^r(e,11)^r(e,25))+((e&g)^(~e&h))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&q)^(a&c)^(q&c)))|0;j=h;h=g;g=e;e=(d+t1)|0;d=c;c=q;q=a;a=(t1+t2)|0}
  [a,q,c,d,e,g,h,j].forEach((v,i)=>H[i]=(H[i]+v)|0)}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

  </div>
  ${S.orderView==='complete'?`<div class="row" style="justify-content:flex-start;gap:8px;margin:12px 0"><button class="btn ${S.completeFilter==='all'?'':'alt'}" onclick="setCompleteFilter('all')">All (${done.length})</button><button class="btn ${S.completeFilter==='success'?'':'alt'}" onclick="setCompleteFilter('success')">Successful (${done.filter(o=>o.st==='released').length})</button><button class="btn ${S.completeFilter==='unsuccessful'?'':'alt'}" onclick="setCompleteFilter('unsuccessful')">Unsuccessful (${done.filter(o=>o.st==='refunded').length})</button></div>`:''}
  ${chosen.length?`<div class="list">${chosen.map(orderCard).join('')}</div>`:`<div class="empty">${S.orderView==='complete'?'No orders in this history filter yet.':S.currentUser?'No open orders. Buy an account from Browse to start one.':'Log in to see your orders.'}</div>`}`;
}
function vAdminHistory(){
  if(!S.adminOk||S.role!=='admin')return '<div class="empty">Admin history is locked.</div>';
  const done=S.orders.filter(o=>o.st==='released'||o.st==='refunded');
  const filtered=done.filter(o=>S.completeFilter==='all'||(S.completeFilter==='success'&&o.st==='released')||(S.completeFilter==='unsuccessful'&&o.st==='refunded'));
  return `<div class="hero"><h1>History</h1><p>Completed and refunded orders only. Active orders are kept in Orders and escrow.</p></div>
  <div class="row" style="justify-content:flex-start;gap:8px;margin:12px 0;flex-wrap:wrap"><button class="btn ${S.completeFilter==='all'?'':'alt'}" onclick="setCompleteFilter('all')">All (${done.length})</button><button class="btn ${S.completeFilter==='success'?'':'alt'}" onclick="setCompleteFilter('success')">Successful (${done.filter(o=>o.st==='released').length})</button><button class="btn ${S.completeFilter==='unsuccessful'?'':'alt'}" onclick="setCompleteFilter('unsuccessful')">Unsuccessful (${done.filter(o=>o.st==='refunded').length})</button></div>
  ${filtered.length?`<div class="list">${filtered.map(orderCard).join('')}</div>`:'<div class="empty">No completed orders in this history filter yet.</div>'}`;
}
function vAdmin(){
  if(!S.adminOk)return '<div class="empty">The admin area is locked. Only the owner can open it.</div>';
  if(S.role!=='admin')return '<div class="empty">Admin tools are hidden. Switch to Admin above to approve listings and settle disputes.</div>';
  const held=S.orders.filter(o=>o.st==='held'||o.st==='delivered'||o.st==='disputed').reduce((s,o)=>s+o.total,0),
   rel=S.orders.filter(o=>o.st==='released'),paid=rel.reduce((s,o)=>s+o.price,0),fee=rel.reduce((s,o)=>s+o.fee,0),
   pend=S.listings.filter(l=>l.status==='pending'),dis=S.orders.filter(o=>o.st==='disputed'),chats=S.orders.filter(o=>o.chat&&o.chat.length&&o.st!=='released'&&o.st!=='refunded'),proofs=S.orders.filter(o=>o.proof&&o.st!=='released'&&o.st!=='refunded');
  return `<div class="hero"><h1>Admin</h1></div><div class="stats"><div class="stat"><span class="mut">Held in escrow</span><b>${tsh(held)}</b></div><div class="stat"><span class="mut">Paid to sellers</span><b>${tsh(paid)}</b></div><div class="stat"><span class="mut">Your fees (10%)</span><b>${tsh(fee)}</b></div></div>
  <h2>Listings to approve</h2>${pend.length?`<div class="list">${pend.map(l=>`<div class="card">${shotHtml(l)}<h3>${esc(ttl(l))}</h3>${adminCreds(l)}<span class="mut">${esc(l.game)} · COLLECTIVE STRENGTH ${Number(l.strength||0).toLocaleString('en-US')} · ${tsh(l.price)} · ${esc(l.seller)}</span><span class="mut">${contactHtml(l)}</span><div class="row" style="justify-content:flex-start"><button class="btn" onclick="setL(${l.id},'live')">Approve</button><button class="btn bad" onclick="setL(${l.id},'x')">Reject</button></div></div>`).join('')}</div>`:'<div class="empty">Nothing waiting for approval.</div>'}
  <h2>Payment proofs</h2>${proofs.length?`<div class="list">${proofs.map(o=>`<div class="card"><div class="row"><h3>Order #${o.id}</h3><span class="tag ${o.proof.status==='verified'?'':o.proof.status==='rejected'?'red':'amb'}">${PROOF_LABEL[o.proof.status]}</span></div><span class="mut raw">Method: ${esc(o.method)} · Amount to match: ${tsh(o.total)} · Reference: ${esc(o.proof.ref)}${o.proof.status==='rejected'&&o.proof.note?` · Your comment: ${esc(o.proof.note)}`:''}</span>${o.proof.img?`<button type="button" class="shot" onclick="viewProof(${o.id})" aria-label="View payment proof larger"><img src="${o.proof.img}" alt="Payment proof screenshot"></button>`:'<span class="mut">Approved without a screenshot.</span>'}${o.proof.status==='sent'?`<div class="row" style="justify-content:flex-start"><button class="btn" onclick="proofSet(${o.id},'verified')">Verify payment</button><button class="btn bad" onclick="proofSet(${o.id},'rejected')">Reject</button></div>`:''}</div>`).join('')}</div>`:'<div class="empty">No payment proofs sent yet.</div>'}
  <h2>Disputes</h2>${dis.length?`<div class="list">${dis.map(orderCard).join('')}</div>`:'<div class="empty">No open disputes.</div>'}
  <h2>Open orders and escrow</h2>${S.orders.filter(o=>o.st!=='released'&&o.st!=='refunded').length?`<div class="list">${S.orders.filter(o=>o.st!=='released'&&o.st!=='refunded').map(orderCard).join('')}</div>`:'<div class="empty">No open orders.</div>'}
   <h2>Order chats</h2>${chats.length?`<div class="list">${chats.map(o=>{const m=o.chat[o.chat.length-1];return `<div class="card"><div class="row"><h3>Order #${o.id}</h3><span class="tag amb">${o.chat.length} message${o.chat.length>1?'s':''}</span></div><span class="mut raw">Last from ${m.from}: ${esc(m.text)}</span><div class="row" style="justify-content:flex-start"><button class="btn" onclick="openChat(${o.id})">Open chat</button></div></div>`}).join('')}</div>`:'<div class="empty">No buyer or seller messages yet.</div>'}`}
async function setL(id,s,reason){if(!S.adminOk)return;
  if(s==='x'&&reason===undefined)return askReason('Reject this order','seller',r=>setL(id,s,r));
  const {error}=await sb.from('listings').update({status:s==='x'?'rejected':s,reject_reason:s==='x'?(reason||null):null}).eq('id',id);
  toast(error?'Could not save. Log in again.':(s==='x'?'Order rejected. The seller can see your comment.':'Listing approved.'));await loadData();render()}
render();
applyPrefs();
</script>
</body>
</html>
